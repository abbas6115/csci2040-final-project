# Use H2 In-Memory Database (No installation needed)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create the tables automatically based on your Java classes
spring.jpa.hibernate.ddl-auto=update


# to see your data while the app is running
spring.h2.console.enabled=true

# CSV export for newly added movies
movie.csv.path=movies.csv